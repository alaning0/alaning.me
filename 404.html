<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — alaning.me</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <meta name="theme-color" content="#eef2f4">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='600' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 90% 70% at 12% 18%, rgba(15, 118, 110, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 55% at 88% 12%, rgba(90, 130, 170, 0.28), transparent 50%),
        radial-gradient(ellipse 80% 60% at 70% 92%, rgba(219, 180, 120, 0.18), transparent 55%),
        linear-gradient(165deg, #f5f7f9 0%, #e8eef2 42%, #d9e4ea 100%);
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .content {
      text-align: center;
      padding: 2rem;
    }

    .code {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0 0 0.5rem;
      opacity: 0.15;
    }

    .title {
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(1.3rem, 4vw, 1.75rem);
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 1rem;
    }

    .message {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text-dim);
      margin: 0 0 2rem;
      max-width: 28ch;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--brand-ink);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .home-link:hover {
      color: var(--brand);
    }

    .home-link svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="content">
      <p class="code">404</p>
      <h1 class="title">Page not found</h1>
      <p class="message">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="home-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
        Back to home
      </a>
    </main>
  </div>
</body>
</html>
