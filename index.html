<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alaning.me</title>
  <meta name="description" content="Alan Ing — personal site. Projects, notes, and experiments.">
  <meta name="theme-color" content="#eef2f4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 90% 70% at 12% 18%, rgba(15, 118, 110, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 55% at 88% 12%, rgba(90, 130, 170, 0.28), transparent 50%),
        radial-gradient(ellipse 80% 60% at 70% 92%, rgba(219, 180, 120, 0.18), transparent 55%),
        linear-gradient(165deg, #f5f7f9 0%, #e8eef2 42%, #d9e4ea 100%);
      animation: wash 18s var(--ease) infinite alternate;
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .shell {
      width: min(100%, 42rem);
      margin: 0 auto;
      padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.25rem, 4vw, 2rem) 4rem;
    }

    .brand {
      margin: 0 0 1.1rem;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(3rem, 10vw, 5.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--ink);
      font-variation-settings: "opsz" 144;
    }

    .headline {
      margin: 0 0 0.75rem;
      max-width: 20ch;
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(1.3rem, 3vw, 1.75rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .lede {
      margin: 0 0 2.5rem;
      max-width: 34ch;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text-dim);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 1.25rem 1.35rem;
    }

    .section-label {
      margin: 0 0 0.85rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    input,
    textarea {
      width: 100%;
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.95rem;
      padding: 0.7rem 0.85rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    textarea {
      min-height: 6rem;
      resize: vertical;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.6rem;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s var(--ease), background 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ink);
      color: #f4f7f8;
    }

    .btn-primary:hover:not(:disabled) {
      background: #000;
    }

    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-dim);
      min-height: auto;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .btn-ghost:hover {
      color: var(--brand-ink);
      transform: none;
    }

    .error {
      margin: 0 0 0.75rem;
      font-size: 0.875rem;
      color: var(--danger);
    }

    .ideas-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem 0 0.9rem;
    }

    .ideas-head h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .idea-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    .idea-card {
      display: flex;
      gap: 0.75rem;
      align-items: start;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      padding: 1rem 1.05rem;
      box-shadow: var(--shadow);
      animation: pop-in 0.35s var(--ease) both;
    }

    .star-btn {
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      margin-top: 0.1rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .star-btn:hover {
      transform: scale(1.08);
      background: var(--star-soft);
    }

    .star-btn.is-on {
      color: var(--star);
      background: var(--star-soft);
    }

    .idea-body {
      min-width: 0;
      flex: 1;
    }

    .idea-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: start;
    }

    .idea-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
    }

    .idea-date {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--text-faint);
      padding-top: 0.15rem;
    }

    .idea-desc {
      margin: 0.45rem 0 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text-dim);
      white-space: pre-wrap;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--text-dim);
    }

    .empty strong {
      display: block;
      margin-bottom: 0.25rem;
      color: var(--text);
      font-weight: 600;
    }

    .muted {
      color: var(--text-faint);
      font-size: 0.9rem;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: reveal 0.85s var(--ease) forwards;
    }

    .d1 { animation-delay: 0.06s; }
    .d2 { animation-delay: 0.14s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.34s; }
    .d5 { animation-delay: 0.44s; }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes wash {
      from { filter: hue-rotate(0deg) saturate(1); }
      to { filter: hue-rotate(8deg) saturate(1.08); }
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .atmosphere,
      .reveal,
      .idea-card {
        animation: none !important;
      }
      .reveal {
        opacity: 1;
        transform: none;
      }
      .btn:hover,
      .star-btn:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="atmosphere" aria-hidden="true"></div>

    <main
      class="shell"
      x-data="ideasApp()"
      x-init="load()"
      x-cloak
    >
      <header>
        <h1 class="brand reveal d1">alaning.me</h1>
        <p class="headline reveal d2">A quiet place on the internet for Alan Ing.</p>
        <p class="lede reveal d3">Projects, notes, and experiments — arriving soon.</p>
      </header>

      <section class="reveal d4" aria-labelledby="capture-heading">
        <p class="section-label" id="capture-heading">Add an idea here</p>
        <form class="panel" @submit.prevent="submitIdea">
          <label for="title">Title</label>
          <input id="title" type="text" x-model="title" required maxlength="200" placeholder="What's the idea?" autocomplete="off">

          <label for="description">Description</label>
          <textarea id="description" x-model="description" maxlength="5000" rows="4" placeholder="A little more context…"></textarea>

          <template x-if="error">
            <p class="error" x-text="error"></p>
          </template>

          <div class="form-row">
            <p class="hint" x-text="ideas.length ? ideas.length + ' saved' : 'Nothing saved yet'"></p>
            <button class="btn btn-primary" type="submit" :disabled="submitting || !title.trim()" x-text="submitting ? 'Saving…' : 'Submit'"></button>
          </div>
        </form>
      </section>

      <section class="reveal d5" aria-labelledby="ideas-heading">
        <div class="ideas-head">
          <h2 id="ideas-heading">Ideas</h2>
          <button type="button" class="btn btn-ghost" @click="filter = filter === 'starred' ? 'all' : 'starred'" x-text="filter === 'starred' ? 'Show all' : 'Favorites only'"></button>
        </div>

        <template x-if="loading">
          <p class="muted">Loading ideas…</p>
        </template>

        <template x-if="!loading && !visibleIdeas.length">
          <div class="empty">
            <strong x-text="filter === 'starred' ? 'No favorites yet' : 'Your first idea goes here'"></strong>
            <span x-text="filter === 'starred' ? 'Star something from the list to pin it.' : 'Title + a short description is enough.'"></span>
          </div>
        </template>

        <ul class="idea-list" x-show="!loading && visibleIdeas.length">
          <template x-for="(idea, index) in visibleIdeas" :key="idea.id">
            <li class="idea-card" :style="'animation-delay:' + (Math.min(index, 8) * 0.04) + 's'">
              <button
                type="button"
                class="star-btn"
                :class="idea.starred ? 'is-on' : ''"
                :aria-label="idea.starred ? 'Unstar idea' : 'Star idea'"
                :disabled="togglingId === idea.id"
                @click="toggleStar(idea)"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" :fill="idea.starred ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9 6.7 19.6l1-5.8-4.2-4.1 5.9-.9L12 3.5z"/>
                </svg>
              </button>
              <div class="idea-body">
                <div class="idea-top">
                  <h3 class="idea-title" x-text="idea.title"></h3>
                  <time class="idea-date" x-text="formatDate(idea.created_at)"></time>
                </div>
                <p class="idea-desc" x-show="idea.description" x-text="idea.description"></p>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>
  </div>

  <script src="/config.js"></script>
  <script>
    function ideasApp() {
      const api = () => (window.ALANING_API || '').replace(/\/$/, '');

      return {
        ideas: [],
        title: '',
        description: '',
        loading: true,
        submitting: false,
        togglingId: null,
        error: null,
        filter: 'all',

        get visibleIdeas() {
          return this.filter === 'starred'
            ? this.ideas.filter((idea) => idea.starred)
            : this.ideas;
        },

        async load() {
          this.loading = true;
          this.error = null;
          try {
            const r = await fetch(api() + '/api/ideas');
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'Could not load ideas');
            this.ideas = data.ideas || [];
          } catch (e) {
            this.error = e.message || 'Could not load ideas';
          } finally {
            this.loading = false;
          }
        },

        async submitIdea() {
          if (!this.title.trim() || this.submitting) return;
          this.submitting = true;
          this.error = null;
          try {
            const r = await fetch(api() + '/api/ideas', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: this.title,
                description: this.description,
              }),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'Could not save idea');
            this.ideas = [data.idea, ...this.ideas];
            this.title = '';
            this.description = '';
          } catch (e) {
            this.error = e.message || 'Could not save idea';
          } finally {
            this.submitting = false;
          }
        },

        async toggleStar(idea) {
          if (this.togglingId) return;
          this.togglingId = idea.id;
          const prev = idea.starred;
          idea.starred = !prev;
          try {
            const r = await fetch(api() + '/api/ideas/' + idea.id + '/star', {
              method: 'POST',
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'Could not update star');
            const idx = this.ideas.findIndex((i) => i.id === idea.id);
            if (idx !== -1) this.ideas[idx] = data.idea;
          } catch (e) {
            idea.starred = prev;
            this.error = e.message || 'Could not update star';
          } finally {
            this.togglingId = null;
          }
        },

        formatDate(value) {
          if (!value) return '';
          const d = new Date(value.includes('T') ? value : value.replace(' ', 'T') + 'Z');
          if (Number.isNaN(d.getTime())) return '';
          return d.toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric',
            year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined,
          });
        },
      };
    }
  </script>
</body>
</html>
