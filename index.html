<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alaning.me</title>
  <meta name="description" content="Alan Ing — personal site. Projects, notes, and experiments.">
  <meta name="theme-color" content="#eef2f4">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='600' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 90% 70% at 12% 18%, rgba(15, 118, 110, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 55% at 88% 12%, rgba(90, 130, 170, 0.28), transparent 50%),
        radial-gradient(ellipse 80% 60% at 70% 92%, rgba(219, 180, 120, 0.18), transparent 55%),
        linear-gradient(165deg, #f5f7f9 0%, #e8eef2 42%, #d9e4ea 100%);
      animation: wash 18s var(--ease) infinite alternate;
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .shell {
      width: min(100%, 42rem);
      margin: 0 auto;
      padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.25rem, 4vw, 2rem) 4rem;
    }

    .brand {
      margin: 0 0 1.1rem;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(3rem, 10vw, 5.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--ink);
      font-variation-settings: "opsz" 144;
    }

    .headline {
      margin: 0 0 0.75rem;
      max-width: 20ch;
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(1.3rem, 3vw, 1.75rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .lede {
      margin: 0 0 0.75rem;
      max-width: 34ch;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text);
    }

    .links {
      margin: 0 0 2.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .link-item {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--brand-ink);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .link-item:hover {
      color: var(--brand);
      text-decoration: underline;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.6rem;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s var(--ease), background 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-dim);
      min-height: auto;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .btn-ghost:hover {
      color: var(--brand-ink);
      transform: none;
    }

    .ideas-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem 0 0.9rem;
    }

    .ideas-head h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .idea-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    .idea-card {
      display: flex;
      gap: 0.75rem;
      align-items: start;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      padding: 1rem 1.05rem;
      box-shadow: var(--shadow);
      animation: pop-in 0.35s var(--ease) both;
    }

    .star-badge {
      flex-shrink: 0;
      width: 1.75rem;
      height: 1.75rem;
      margin-top: 0.15rem;
      border-radius: 999px;
      background: var(--star-soft);
      color: var(--star);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .idea-body {
      min-width: 0;
      flex: 1;
    }

    .idea-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: start;
    }

    .idea-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
    }

    .idea-link {
      color: var(--brand-ink);
      text-decoration: none;
      word-break: break-all;
      transition: color 0.15s ease;
    }

    .idea-link:hover {
      color: var(--brand);
      text-decoration: underline;
    }

    .idea-date {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--text-faint);
      line-height: 1;
      margin-left: auto;
      padding-left: 0.75rem;
    }

    .idea-copy {
      min-width: 0;
      flex: 1;
    }

    .idea-desc {
      margin: 0.45rem 0 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .error-box {
      border: 1px solid rgba(180, 35, 24, 0.2);
      border-radius: var(--radius);
      background: rgba(180, 35, 24, 0.06);
      padding: 1.25rem 1.35rem;
      text-align: center;
    }

    .error-message {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--danger);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--text-dim);
    }

    .empty strong {
      display: block;
      margin-bottom: 0.25rem;
      color: var(--text);
      font-weight: 600;
    }

    .muted {
      color: var(--text-faint);
      font-size: 0.9rem;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: reveal 0.85s var(--ease) forwards;
    }

    .d1 { animation-delay: 0.06s; }
    .d2 { animation-delay: 0.14s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.34s; }
    .d5 { animation-delay: 0.44s; }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes wash {
      from { filter: hue-rotate(0deg) saturate(1); }
      to { filter: hue-rotate(8deg) saturate(1.08); }
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .atmosphere,
      .reveal,
      .idea-card {
        animation: none !important;
      }
      .reveal {
        opacity: 1;
        transform: none;
      }
      .btn:hover,
      .star-btn:hover,
      .icon-btn:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="atmosphere" aria-hidden="true"></div>

    <main
      class="shell"
      x-data="ideasApp()"
      x-init="load()"
      x-cloak
    >
      <header>
        <h1 class="brand reveal d1">alaning.me</h1>
        <p class="headline reveal d2">A quiet place on the internet for Alan Ing.</p>
        <p class="lede reveal d3">Engineer and maker. Notes and experiments below.</p>
        <p class="links reveal d3">
          <a href="https://github.com/alaning0" target="_blank" rel="noopener" class="link-item">GitHub</a>
        </p>
      </header>

      <section class="reveal d4" aria-labelledby="ideas-heading">
        <div class="ideas-head">
          <h2 id="ideas-heading">Ideas</h2>
          <button
            type="button"
            class="btn btn-ghost"
            x-show="hasStarred"
            @click="filter = filter === 'starred' ? 'all' : 'starred'"
            x-text="filter === 'starred' ? 'Show all' : 'Favorites only'"
          ></button>
        </div>

        <template x-if="loading && !error">
          <p class="muted">Loading ideas…</p>
        </template>

        <template x-if="error">
          <div class="error-box">
            <p class="error-message" x-text="error"></p>
            <button type="button" class="btn btn-ghost" @click="retry()" x-show="!retrying">Try again</button>
          </div>
        </template>

        <template x-if="!loading && !error && !visibleIdeas.length">
          <div class="empty">
            <strong x-text="filter === 'starred' ? 'No favorites yet' : 'Nothing here yet'"></strong>
            <span x-text="filter === 'starred' ? 'No starred items to show.' : 'Check back later.'"></span>
          </div>
        </template>

        <ul
          class="idea-list"
          x-show="!loading && visibleIdeas.length"
        >
          <template x-for="(idea, index) in visibleIdeas" :key="idea.id">
            <li class="idea-card" :style="'animation-delay:' + (Math.min(index, 8) * 0.04) + 's'">
              <template x-if="idea.starred">
                <span class="star-badge" aria-label="Starred">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9 6.7 19.6l1-5.8-4.2-4.1 5.9-.9L12 3.5z"/>
                  </svg>
                </span>
              </template>
              <div class="idea-body">
                <div class="idea-top">
                  <div class="idea-copy">
                    <h3 class="idea-title">
                      <template x-if="isUrl(idea.title)">
                        <a :href="idea.title" target="_blank" rel="noopener" class="idea-link" x-text="formatUrl(idea.title)"></a>
                      </template>
                      <template x-if="!isUrl(idea.title)">
                        <span x-text="idea.title"></span>
                      </template>
                    </h3>
                    <p class="idea-desc" x-show="idea.description" x-text="idea.description"></p>
                  </div>
                  <time class="idea-date" x-text="formatDate(idea.created_at)"></time>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>
  </div>

  <script src="/config.js"></script>
  <script>
    function ideasApp() {
      const api = () => (window.ALANING_API || '').replace(/\/$/, '');
      const MAX_RETRIES = 3;
      const RETRY_DELAY = 2000;

      return {
        ideas: [],
        loading: true,
        error: null,
        retrying: false,
        filter: 'all',

        get visibleIdeas() {
          return this.filter === 'starred'
            ? this.ideas.filter((idea) => idea.starred)
            : this.ideas;
        },

        get hasStarred() {
          return this.ideas.some((idea) => idea.starred);
        },

        isUrl(text) {
          if (!text) return false;
          return /^https?:\/\/\S+$/i.test(text.trim());
        },

        formatUrl(url) {
          try {
            const u = new URL(url);
            let display = u.hostname.replace(/^www\./, '');
            if (u.pathname && u.pathname !== '/') {
              display += u.pathname.length > 30
                ? u.pathname.slice(0, 27) + '…'
                : u.pathname;
            }
            return display;
          } catch {
            return url.length > 50 ? url.slice(0, 47) + '…' : url;
          }
        },

        async load(retryCount = 0) {
          this.loading = true;
          this.error = null;
          this.retrying = retryCount > 0;
          try {
            const r = await fetch(api() + '/api/ideas');
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'Could not load ideas');
            this.ideas = data.ideas || [];
            this.retrying = false;
          } catch (e) {
            if (retryCount < MAX_RETRIES) {
              this.error = `Loading failed. Retrying (${retryCount + 1}/${MAX_RETRIES})…`;
              setTimeout(() => this.load(retryCount + 1), RETRY_DELAY);
              return;
            }
            this.error = 'Could not load ideas. Please refresh the page.';
            this.retrying = false;
          } finally {
            if (!this.retrying) {
              this.loading = false;
            }
          }
        },

        retry() {
          this.load(0);
        },

        formatDate(value) {
          if (!value) return '';
          const d = new Date(value.includes('T') ? value : value.replace(' ', 'T') + 'Z');
          if (Number.isNaN(d.getTime())) return '';
          return d.toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric',
            year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined,
          });
        },
      };
    }
  </script>
</body>
</html>
